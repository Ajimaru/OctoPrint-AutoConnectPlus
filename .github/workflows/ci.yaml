name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff
        run: ruff check .

  # Run the unit tests against both OctoPrint generations: the tests mock the
  # connector framework themselves, so they pass on 1.x (serial-only) too.
  test:
    name: Tests (OctoPrint ${{ matrix.label }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest and newest supported Python against the stable 1.x line.
          # actions/setup-python has no Python 3.9 for ubuntu-latest (26.04)
          # any more, only up to 24.04 - but 3.9 stays supported
          # (requires-python, OctoPi images on Debian Bullseye run it).
          - label: "1.x"
            python: "3.9"
            runner: ubuntu-24.04
            octoprint: "OctoPrint>=1.11,<2"
            pre: ""
            blocking: true
          - label: "1.x"
            python: "3.12"
            octoprint: "OctoPrint>=1.11,<2"
            pre: ""
            blocking: true
          # Stable 2.x (2.0.0 shipped 2026-11-16). Blocking like 1.x: it also
          # runs tests/test_import_guard.py, which fails if the plugin loses
          # its connector support to OctoPrint's circular import - or reports
          # (strict XPASS) that OctoPrint fixed it and the workaround can go.
          - label: "2.x"
            python: "3.12"
            octoprint: "OctoPrint>=2,<3"
            pre: ""
            blocking: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install OctoPrint and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.pre }} "${{ matrix.octoprint }}" pytest

      - name: Run tests
        # Non-blocking legs report failures without failing the job.
        continue-on-error: ${{ !matrix.blocking }}
        run: python -m pytest -q
